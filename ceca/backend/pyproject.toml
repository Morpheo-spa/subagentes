[project]
name = "estampa-backend"
version = "0.1.0"
description = "Estampa - DeCA delivery note registry API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "email-validator>=2.2",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "httpx>=0.27",
    "redis>=5.0",
    "dramatiq[redis]>=1.17",
    "segno>=1.6",
    "reportlab>=4.2",
    "pypdf>=4.3",
    "python-multipart>=0.0.9",
    "aioboto3>=13.0",
    "aioftp>=0.22",
    "stripe>=10.0",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "faker>=26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC"]
ignore = [
    # Asserts are the point of a test suite; S101 is silenced per-file below.
    "B008",  # FastAPI dependencies are function calls in defaults by design.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"alembic/**" = ["E501"]
"app/models/**" = ["N805"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = []
exclude = "(^alembic/versions/|^\\.venv/)"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# -p no:anyio: two async plugins means two event loops, and asyncpg connections
# cannot cross them. pytest-asyncio in auto mode is the only runner here.
addopts = "-q --strict-markers -p no:anyio"
filterwarnings = ["ignore::DeprecationWarning"]
