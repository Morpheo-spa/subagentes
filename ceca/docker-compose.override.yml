# Development overrides: hot reload and source mounted from the host.
# Compose loads this automatically; production deploys must pass -f docker-compose.yml only.

services:
  api:
    build:
      target: dev
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - api_local_storage:/var/lib/estampa/storage

  worker:
    build:
      target: dev
    command: ["dramatiq", "app.tasks", "--processes", "1", "--threads", "2", "--watch", "/app"]
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - api_local_storage:/var/lib/estampa/storage

  frontend:
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  traefik:
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --log.level=DEBUG
      - --api.insecure=true

volumes:
  api_local_storage:
  frontend_node_modules:
