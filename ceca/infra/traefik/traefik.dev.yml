# Traefik 3 static configuration - DEVELOPMENT ONLY.
#
# Mounted over /etc/traefik/traefik.yml by docker-compose.dev.yml, which is not
# loaded unless it is passed with -f. It drops TLS (no certificate authority can
# reach a laptop) and turns the dashboard on without authentication, which is
# exactly why it must never reach a server.
#
# Do not copy settings from here into infra/traefik/traefik.yml.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: DEBUG

accessLog: {}

api:
  dashboard: true
  insecure: true  # unauthenticated: only ever bound to localhost by compose

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  # `insecure: true` above serves the dashboard on the implicit `traefik`
  # entrypoint (:8080). docker-compose.dev.yml publishes it on 127.0.0.1 only.

providers:
  docker:
    exposedByDefault: false
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true
