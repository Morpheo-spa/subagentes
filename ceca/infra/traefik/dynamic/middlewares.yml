# Traefik 3 dynamic configuration: middlewares shared by every router.

http:
  middlewares:
    # A DeCA file is capped at 5 MB by the Resolution and an upload carries at
    # most MAX_FILES_PER_UPLOAD of them. The application already enforces that
    # while the body streams in; this stops an oversized body from reaching the
    # process at all. Keep it above the application's own ceiling, never below,
    # or a legitimate batch is cut off at the edge with an opaque error.
    # 501 MB is the API's own ceiling (100 files x 5 MB + 1 MB of form
    # overhead); this sits just above it. It used to be 600 MB, a hundred
    # megabytes of nothing that Traefik would still spool to disk.
    upload-body-limit:
      buffering:
        maxRequestBodyBytes: 530579456
        memRequestBodyBytes: 1048576
        retryExpression: "IsNetworkError() && Attempts() < 2"

    # Bodies are bounded per request; this bounds how many of them one client
    # can have in flight, so the disk both proxies spool to is bounded too.
    api-inflight:
      inFlightReq:
        amount: 32

    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        frameDeny: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"

    # The public QR viewer must never reach a search index or a shared cache.
    public-viewer:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
          Cache-Control: "no-store"
          Pragma: "no-cache"

    # Credential stuffing guard on the login endpoint.
    # No ipStrategy on purpose: the key is the TCP peer address (RemoteAddr).
    # Traefik is the edge, so the peer IS the client. An `ipStrategy.depth`
    # would read X-Forwarded-For, which Traefik has already stripped from an
    # untrusted peer at this point (its own address is appended later, in the
    # reverse proxy), so the key would be "" for everyone and ten requests
    # would lock the login of the whole platform (audit N-01). The application
    # reads the same client with TRUSTED_PROXY_COUNT=1 (app/routers/client_ip),
    # counting the address Traefik appends; the two describe the same hop.
    login-ratelimit:
      rateLimit:
        average: 5
        burst: 10
        period: 1m

    # A labelled parcel can be scanned repeatedly by the same roadside agent,
    # so the viewer limit is looser than login but still bounded.
    viewer-ratelimit:
      rateLimit:
        average: 60
        burst: 30
        period: 1m

    api-ratelimit:
      rateLimit:
        average: 300
        burst: 100
        period: 1m

  routers:
    # Same service as the api router, but matched first so the rate limit applies
    # only to the login endpoint. The service is declared by the Docker labels.
    estampa-login:
      rule: "Path(`/api/v1/auth/login`)"
      entryPoints:
        - web
        - websecure
      priority: 200
      service: estampa-api@docker
      middlewares:
        - security-headers
        - login-ratelimit
